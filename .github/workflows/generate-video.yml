# .github/workflows/generate-video.yml
name: Generate Real-Estate Video

on:
  push:
    paths:
      - 'topics/*.json'
      - 'src/**'
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic ID to generate (1=short, 2=long)'
        required: false
        default: '2'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml
      
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: Create topics manifest
        run: |
          echo '{
            "videos": [{
              "sections": [
                {"text": "Gurgaon luxury apartments are booming in 2026"},
                {"text": "Noida Expressway sees record prices"},
                {"text": "Greater Noida West emerges as a hotspot"},
                {"text": "Dwarka Expressway connecting Delhi and Gurgaon"},
                {"text": "Affordable housing in Delhi NCR"},
                {"text": "Real estate market outlook 2026"}
              ]
            }]
          }' > output/pending_video_review.json
          mkdir -p logs
      
      - name: Generate video with stock footage
        run: python src/stock_footage.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: output/*.mp4
          retention-days: 7
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 3
