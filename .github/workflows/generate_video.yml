name: Generate Video
# Triggered manually (by Hermes or via GitHub UI) with comma-separated topic
# ids from the latest pending_topics.json artifact.
# Produces a video MP4 + pending_video_review.json → uploaded as artifact for
# Gate-2 (human approval).
on:
  workflow_dispatch:
    inputs:
      topic_indices:
        description: "Comma-separated topic ids from pending_topics.json, e.g. '1,3'"
        required: true
        type: string
      topics_run_id:
        description: "Run ID of the generate_topics workflow that produced pending_topics.json"
        required: true
        type: number

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read    # required to download artifacts from another run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download topics manifest (pending_topics.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.topics_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "pending-topics-${{ inputs.topics_run_id }}" \
            --dir /tmp/topics-artifact
          mkdir -p output
          cp "$(find /tmp/topics-artifact -name 'pending_topics.json' | head -1)" output/pending_topics.json
      - name: Generate video
        run: python src/generate_video.py --topics "${{ inputs.topic_indices }}"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # TTS_PROVIDER is pinned to edge: the approved voice
          # (en-IN-PrabhatNeural) is an edge-tts voice, and the coqui
          # provider blocks on an interactive license prompt (EOF on
          # runners). COQUI_TOS_AGREED=1 is set as belt-and-suspenders
          # so even a coqui path can never prompt for input.
          TTS_PROVIDER:  edge
          TTS_VOICE:     ${{ vars.TTS_VOICE || 'en-IN-PrabhatNeural' }}
          COQUI_TOS_AGREED: "1"
      - name: Upload manifest + video
        uses: actions/upload-artifact@v4
        with:
          name: pending-video-${{ github.run_id }}
          path: |
            output/pending_video_review.json
            output/video_*.mp4